{% extends 'store/base.html' %}

{% block title %}Page Not Found - My Store{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Page not found.</h2>
        <p class="error-text">The page you are looking for might have been removed, had its name changed, or is
            temporarily unavailable.</p>
        <a href="{% url 'index' %}" class="error-btn">Go to Homepage</a>
    </div>
</div>
{% endblock %}
