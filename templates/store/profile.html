{% extends 'store/base.html' %}

{% block title %}My Profile - My Store{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container" style="max-width: 600px;">
        <h2>My Profile</h2>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ user.username }}" disabled>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ profile.full_name|default:'' }}"
                    placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" value="{{ profile.phone|default:'' }}" placeholder="09xxxxxxxx">
            </div>

            <div class="form-row" style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>City</label>
                    <input type="text" name="city" value="{{ profile.city|default:'' }}">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Area</label>
                    <input type="text" name="area" value="{{ profile.area|default:'' }}">
                </div>
            </div>

            <div class="form-group">
                <label>Street</label>
                <input type="text" name="street" value="{{ profile.street|default:'' }}">
            </div>

            <div class="form-group">
                <label>Building / Floor</label>
                <input type="text" name="building" value="{{ profile.building|default:'' }}">
            </div>

            <button type="submit" class="auth-btn">Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
