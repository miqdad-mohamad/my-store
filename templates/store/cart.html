{% extends 'store/base.html' %}

{% block title %}Cart - My Store{% endblock %}

{% block content %}
<div class="cart-page">
        <h1 class="page-title">Your Shopping Cart</h1>
    <div class="cart-container">
        <!-- جدول المنتجات -->
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- المنتج 1 -->
                <tr>
                    <td class="product-info">
                        <img src="https://picsum.photos/100/100?random=1" alt="Product 1">
                        <span>Mobile Phone X</span>
                    </td>
                    <td>$500</td>
                    <td>
                        <input type="number" value="1" min="1" class="qty-input">
                    </td>
                    <td>$500</td>
                    <td><button class="remove-btn">Remove</button></td>
                </tr>
                <!-- المنتج 2 -->
                <tr>
                    <td class="product-info">
                        <img src="https://picsum.photos/100/100?random=2" alt="Product 2">
                        <span>Wireless Battery</span>
                    </td>
                    <td>$25</td>
                    <td>
                        <input type="number" value="2" min="1" class="qty-input">
                    </td>
                    <td>$50</td>
                    <td><button class="remove-btn">Remove</button></td>
                </tr>
            </tbody>
        </table>

        <!-- ملخص الطلب -->
        <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span>$550</span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span>$10</span>
            </div>
            <div class="summary-row total">
                <span>Total:</span>
                <span>$560</span>
            </div>
            <a href="{% url 'checkout' %}" class="checkout-btn">Proceed to Checkout</a>
        </div>
    </div>
</div>
{% endblock %}
