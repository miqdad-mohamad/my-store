{% extends 'store/base.html' %}

{% block title %}Checkout - My Store{% endblock %}

{% block content %}
<div class="checkout-page">
    <h1 class="page-title">Checkout</h1>

    <div class="checkout-container">
        <!-- نموذج الشحن والدفع -->
        <form class="checkout-form" action="#" method="POST">
            <h2>Shipping Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone" required>
                </div>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Street, building, etc." required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label for="zip">ZIP Code</label>
                    <input type="text" id="zip" name="zip" placeholder="ZIP" required>
                </div>
            </div>

            <h2>Payment Method</h2>
            <div class="form-group">
                <label for="cardname">Name on Card</label>
                <input type="text" id="cardname" name="cardname" placeholder="Cardholder name" required>
            </div>
            <div class="form-group">
                <label for="cardnumber">Card Number</label>
                <input type="text" id="cardnumber" name="cardnumber" placeholder="1234 5678 9012 3456" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required>
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="123" required>
                </div>
            </div>

            <button type="submit" class="place-order-btn">Place Order</button>
        </form>

        <!-- ملخص الطلب -->
        <div class="order-summary">
            <h2>Your Order</h2>
            <div class="order-item">
                <span>Mobile Phone X (x1)</span>
                <span>$500</span>
            </div>
            <div class="order-item">
                <span>Wireless Battery (x2)</span>
                <span>$50</span>
            </div>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span>$550</span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span>$10</span>
            </div>
            <div class="summary-row total">
                <span>Total:</span>
                <span>$560</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
