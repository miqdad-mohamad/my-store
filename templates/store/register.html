{% extends 'store/base.html' %}

{% block title %}Register - My Store{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <h2>Create an Account</h2>

        <!-- action="#" يعني مؤقتاً، لما نبلش Django رح نحط رابط الـ View -->
        <form action="#" method="POST" class="auth-form">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="password">Confirm your password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password again" required>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="{% url 'login' %}">Alrady have an account? login</a>
            </div>

            <button type="submit" class="auth-btn">Register</button>
        </form>
    </div>
</div>
{% endblock %}
