<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - My Store</title>
</head>

<body>
    <!-- 1. نفس الـ Navbar -->
    <header>
        <nav class="top-nav" aria-label="Main Navigation">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="#aboutus">About US</a></li>
            </ul>
            <ul class="nav-links">
                <li><a href="login.html" class="login">Login</a></li>
                <li><a href="register.html" class="register">Register</a></li>
            </ul>
        </nav>
    </header>

    <!--محتوى صفحة الدخول -->
    <main class="auth-page">
        <div class="auth-container">
            <h2>Create an Account</h2>

            <!-- action="#" يعني مؤقتاً، لما نبلش Django رح نحط رابط الـ View -->
            <form action="#" method="POST" class="auth-form">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="password">Confirm your password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password again" required>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="login.html">Alrady have an account? login</a>
                </div>

                <button type="submit" class="auth-btn">Register</button>
            </form>
        </div>
    </main>

    <!-- 3. نفس الـ Footer -->
    <footer>
        <div class="footer-content" id="aboutus">
            <h2>Contact Us via:</h2>
            <p>Phone: <a href="tel:+963123456789">+963 123 456 789</a></p>
            <p>Email: <a href="mailto:store@sells.com">store@sells.com</a></p>
            <p>Facebook: <a href="#">facebook-page</a></p>
            <p>Instagram: <a href="#">instagram-page</a></p>
        </div>
        <hr>
        <p class="copyright">&copy; 2026 All Rights Reserved</p>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
